name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: dotnet build DvPhotoValidator.sln -c Release

      - name: Test
        run: dotnet test DvPhotoValidator.sln -c Release --no-build

      - name: Publish (win-x64, self-contained)
        run: dotnet publish src/DvPhotoValidator.App -c Release -r win-x64 --self-contained true -p:DebugType=none -o publish

      - uses: actions/upload-artifact@v4
        with:
          name: DvPhotoValidator-win-x64
          path: publish
